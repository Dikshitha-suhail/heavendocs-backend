[phases.setup]
nixPkgs = ["python311", "gcc", "glib", "nss", "nspr", "dbus", "at-spi2-core", "cups", "libdrm", "libxkbcommon", "xorg.libX11", "xorg.libXcomposite", "xorg.libXdamage", "xorg.libXext", "xorg.libXfixes", "xorg.libXrandr", "mesa", "expat", "xorg.libxcb"]

[phases.install]
cmds = ["pip install -r requirements.txt", "playwright install chromium --with-deps"]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
